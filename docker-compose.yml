services:
  ros2:
    image: gressus-ros2
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gressus-ros2
    network_mode: host
    privileged: true
    ipc: host
    restart: unless-stopped
    tty: true
    stdin_open: true
    group_add:
      - dialout
      - video
      - audio
    environment:
      DISPLAY: ${DISPLAY:-}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-}
      PULSE_SERVER: ${PULSE_SERVER:-}
      XAUTHORITY: /root/.Xauthority
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - .:/gressus:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - ${XDG_RUNTIME_DIR:-/dev/null}:${XDG_RUNTIME_DIR:-/dev/null}:rw
      - /dev:/dev
    working_dir: /gressus/ros2_ws
    entrypoint: ["/gressus/docker/entrypoint.sh"]
    command: bash

  backend:
    image: gressus-backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: gressus-backend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - ros2
    environment:
      ROS_CONTAINER: gressus-ros2
      QT_QPA_PLATFORM: ${QT_QPA_PLATFORM:-xcb}
    volumes:
      - .:/gressus:rw
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    image: gressus-frontend
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: gressus-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      IS_DEBUG: ${IS_DEBUG:-true}
    volumes:
      - ./frontend:/gressus/frontend
      - frontend_node_modules:/gressus/frontend/node_modules

volumes:
  frontend_node_modules:
