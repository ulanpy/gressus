services:
  ros2:
    image: gressus-ros2
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gressus-ros2
    network_mode: host
    privileged: true
    ipc: host
    restart: unless-stopped
    tty: true
    stdin_open: true
    group_add:
      - dialout
      - video
      - audio
    environment:
      DISPLAY: ${DISPLAY:-}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-}
      PULSE_SERVER: ${PULSE_SERVER:-}
      XAUTHORITY: /root/.Xauthority
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      GRESSUS_SESSION_MANAGER: ${GRESSUS_SESSION_MANAGER:-1}
      GRESSUS_SESSION_PORT: ${GRESSUS_SESSION_PORT:-9090}
      GRESSUS_SESSION_DATA_ROOT: ${GRESSUS_SESSION_DATA_ROOT:-/data/sessions}
      GRESSUS_ROSBAG_TOPICS: ${GRESSUS_ROSBAG_TOPICS:-/exoskeleton/telemetry /exoskeleton/calibration_status}
    volumes:
      - .:/gressus:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - ${XDG_RUNTIME_DIR:-/dev/null}:${XDG_RUNTIME_DIR:-/dev/null}:rw
      - /dev:/dev
    working_dir: /gressus/ros2_ws
    entrypoint: ["/gressus/docker/entrypoint.sh"]
    command: bash

  backend:
    image: gressus-backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: gressus-backend
    # host network cannot resolve the postgres service name; use published port
    network_mode: host
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      SESSION_MANAGER_URL: ${SESSION_MANAGER_URL:-http://127.0.0.1:9090}
      QT_QPA_PLATFORM: ${QT_QPA_PLATFORM:-xcb}
    volumes:
      - .:/gressus:rw
    command: ["/gressus/docker/backend/start.sh"]

  frontend:
    image: gressus-frontend
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: gressus-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      IS_DEBUG: ${IS_DEBUG:-true}
    volumes:
      - ./frontend:/gressus/frontend
      - frontend_node_modules:/gressus/frontend/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: gressus-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - gressus-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: gressus-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres
    networks:
      - gressus-network
    restart: always
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json

volumes:
  postgres_data:
  frontend_node_modules:
  pgadmin_data:

networks:
  gressus-network:
    driver: bridge
